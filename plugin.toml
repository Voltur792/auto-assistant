[plugin]
id = "auto-assistant"
name = "Auto Assistant"
version = "1.2.1"
description = "Reads mail over IMAP, finds actionable important messages with a local model, and creates tasks, reminders and calendar events in Astra's native widgets."
author = "Voltur"
license = "MIT"

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python"]

# Что демон может вызывать ВНУТРЬ плагина.
[capabilities]
tools = true            # Astra может спрашивать дайджест в чате
actions = true          # шаги для редактора автоматизаций (дайджест почты)
triggers = true         # «важное письмо найдено» -> запускает команду пользователя
ui_contributions = true # контроллер и панель «Помощник»
dom_access = true       # authenticated native widget API in the Astra window

# Куда плагин имеет право звонить НАРУЖУ (default-deny). Reasons are shown on
# the consent sheet untranslated, so they are in English (check N7).
[permissions]
dom_access = { reason = "Adds verified mail tasks and deadlines to Astra's native widgets, without letting the language model execute tools." }
fire_trigger = { reason = "Starts your automation (for example, a voice announcement) when an important letter is found" }
push_to_ui = { reason = "Refreshes the assistant tab when new mail arrives" }

# Настройки живут во вкладке «Помощник» (пароли приложений, белый список) —
# форма Astra здесь не нужна.
[config]
schema = "{ \"type\": \"object\", \"properties\": {} }"

[platform]
os = ["windows", "linux", "macos"]
arch = ["x86_64"]
